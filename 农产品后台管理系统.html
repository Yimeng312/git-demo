<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>农产品后台管理系统</title>
    <style>
        [v-cloak] { display: none; }
        *{ margin: 0; padding: 0; }
        .borders { border: 1px solid black; }
        .text-center{ text-align: center; }
        .left { float: left; margin-left: 20px; }
        .right { float: right; margin-left: 20px; margin-bottom: 50px; }
        #app{ display: flex; }
        .tab{ width: 150px; height: 100vh; list-style: none; background-color:rgb(115,136,193); color: #fff; line-height: 40px; text-align: center; }
        .activity{ color: rgb(17,52,106); font-weight: bold; }
        .table{ flex:1; }
        th,td{ padding: 6px 12px; border:1px solid #ccc; }
        table{ border-collapse: collapse; margin-top:10px; }
        button{ margin:0 4px; padding:4px 8px; cursor:pointer; }
    </style>
</head>
<body>
<div id="app">
    <ul class="tab">
        <li v-for="(item,index) in tabNameList" :key="item.id" 
            :class="{activity: currentIndex == index}" 
            @click="changeTab(index)">
            {{ item.name }}
        </li>
    </ul>

    <div style="flex:1; padding:20px;">
        <div class="home" v-show="currentIndex == 0">欢迎进入，首页</div>
        <div class="admin" v-show="currentIndex == 1">欢迎进入，用户管理页</div>
        
        <div class="table" v-show="currentIndex == 2">
            <h1 class="text-center">商品信息页</h1>
            <table class="left" v-cloak>
                <thead>
                    <tr>
                        <th class="borders" v-for="(item,idx) in tableHead" :key="idx">{{ item }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item,index) in proList" :key="item.id">
                        <td>{{ item.id }}</td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.place }}</td>
                        <td>{{ item.price }}</td>
                        <td>{{ item.stock }}</td>
                        <td>{{ item.addTime }}</td>
                        <td>
                            <button @click="edit(item,index)">编辑</button>
                            <button @click="deletes(index)">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="right" v-show="flag">
                商品名称：<input type="text" v-model="common.thName"><br/>
                产地：<input type="text" v-model="common.thPlace"><br/>
                价格：<input type="text" v-model="common.thPrice"><br/>
                库存：<input type="text" v-model="common.thStock"><br/>
                入库时间：<input type="text" v-model="common.thAddtime"><br/>
                <button @click="over()">提交修改</button>
            </div>

            <p style="margin-left: 20px; margin-top:10px;">全部商品库存：{{ totalstock }}</p>
        </div>

        <div class="addShop" v-show="currentIndex == 3">欢迎进入，新增商品页</div>
        <div class="order" v-show="currentIndex == 4">欢迎进入，订单信息页</div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const vm = Vue.createApp({
    data() {
        return {
            currentIndex: 2,
            flag: false,
            editIndex: -1,
            tableHead: ['ID', '商品名称', '产地', '价格', '库存', '入库时间', '操作'],
            common: {thID: '',thName: '',thPlace: '',thPrice: '',thStock: '',thAddtime: ''},
            proList: [
                {id: 1, name: '蜂王精',place: '北京',price: '99',stock: 55,addTime: '2021-12-02'},
                {id: 2, name: '罗汉果',place: '广西',price: '50',stock: 173,addTime: '2021-6-21'},
                {id: 3,name: '龙井',place: '浙江',price: '1499',stock: 89,addTime: '2021-6-26'},
                {id: 4,name: '大磨盘柿',place: '北京',price: '45',stock: 76,addTime: '2022-09-14'},
                {id: 5,name: '百色芒果',place: '广西',price: '67',stock: 99,addTime: '2022-08-13'},
                {id: 6,name: '四川脐橙',place: '四川',price: '38',stock: 120,addTime: '2023-01-10'}
            ],
            tabNameList:[
                {id:'1',name:'首页'},
                {id:'2',name:'用户管理'},
                {id:'3',name:'商品信息'},
                {id:'4',name:'新增商品'},
                {id:'5',name:'订单信息'},
            ]
        }
    },
    methods: {
        changeTab(index) { this.currentIndex = index; },
        edit(item, index) {
            this.flag = true;
            this.editIndex = index;
            this.common.thID = item.id;
            this.common.thName = item.name;
            this.common.thPlace = item.place;
            this.common.thPrice = item.price;
            this.common.thStock = item.stock;
            this.common.thAddtime = item.addTime;
        },
        deletes(index) {
            if(confirm('确定删除该商品吗？')){
                this.proList.splice(index, 1);
            }
        },
        over() {
            if(this.editIndex == -1) return;
            this.proList[this.editIndex] = {
                id: this.common.thID,
                name: this.common.thName,
                place: this.common.thPlace,
                price: this.common.thPrice,
                stock: Number(this.common.thStock),
                addTime: this.common.thAddtime
            };
            this.flag = false;
            this.editIndex = -1;
        }
    },
    computed:{
        totalstock(){
            return this.proList.reduce((sum, item) => sum + Number(item.stock), 0);
        }
    }
}).mount('#app')
</script>
</body>
</html>
