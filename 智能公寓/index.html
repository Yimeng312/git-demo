<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智慧公寓官网</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div>
    <!-- 顶部导航 -->
    <div class="top-title">
      <div class="title-left">
        <p>智慧公寓官网</p>
      </div>
      <div class="title-right">
        <p>|</p>
        <p>登录</p>
        <p>|</p>
        <p>注册</p>
        <p>|</p>
        <p>购物车</p>
      </div>
    </div>

    <!-- 搜索导航栏 -->
    <div class="search-nav">
      <div class="nav-logo">
        <div class="logo">icon</div>
        <div class="nav-title">智慧公寓</div>
      </div>
      <div class="search-left">
        <p>上新专区</p>
        <p>热卖专区</p>
        <p>设施配备</p>
        <p>关于我们</p>
      </div>
    </div>

    <!-- 内容容器 -->
    <div class="container">
      <!-- 轮播图 -->
      <div class="carousel">
        <div class="banner-container">
          <div class="carousel-inner">
            <img src="./images/01.jpg" alt="banner1">
            <img src="./images/02.jpg" alt="banner2">
            <img src="./images/03.jpg" alt="banner3">
          </div>
          <div class="carousel-control-prev icon-style">L</div>
          <div class="carousel-control-next icon-style">R</div>
          <div class="time" id="clock"></div>
        </div>
      </div>

      <!-- 左侧菜单 -->
      <div class="left-menu">
        <div class="menu">
          <ul class="ul-list">
            <li class="first-item">公寓
              <span>&gt;</span>
              <ul class="submenu">
                <li>普通公寓</li>
                <li>商务公寓</li>
                <li>酒店式公寓</li>
              </ul>
            </li>
            <li class="first-item">loft
              <span>&gt;</span>
              <ul class="submenu">
                <li>简约风</li>
                <li>原木风</li>
                <li>工业风</li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
